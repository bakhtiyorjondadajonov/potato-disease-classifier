services:
  # Backend - FastAPI
  - type: web
    name: leafsense-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: POTATO_GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: POTATO_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: POTATO_ALLOWED_ORIGINS
        value: '["https://leafsense-frontend.onrender.com"]'
      - key: PORT
        value: "8000"
